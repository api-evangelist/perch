name: Perch
description: >-
  Perch is a computer-vision weight-room performance monitoring system that
  captures athlete movement — velocity-based training, jump testing, and
  strength programming — from 3D cameras mounted on the rack, without wearables
  or tethers. Spun out of MIT and backed by SoftBank Vision Fund and Techstars,
  Perch was acquired by sports-technology company Catapult; the perch.fit domain
  now 301-redirects to catapult.com/perch, where the product is sold and
  supported as part of Catapult's athlete-monitoring suite. Perch exposes no
  public API, developer portal, SDK, or machine-readable API specification —
  this profile is retained as an identity record for the acquired brand.
